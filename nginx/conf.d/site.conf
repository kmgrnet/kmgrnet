server {
    listen 443 ssl http2;
    server_name kmgrnet.com www.kmgrnet.com;

    ssl_certificate /etc/nginx/ssl/kmgrnet.crt;
    ssl_certificate_key /etc/nginx/ssl/kmgrnet.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html/pc;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        root /var/www/html/likeshop/public;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    location /api/ {
        root /var/www/html/likeshop/public;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    location ~ \.php$ {
        root /var/www/html/likeshop/public;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

server {
    listen 443 ssl http2;
    server_name m.kmgrnet.com;

    ssl_certificate /etc/nginx/ssl/kmgrnet.crt;
    ssl_certificate_key /etc/nginx/ssl/kmgrnet.key;

    root /usr/share/nginx/html/h5;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name api.kmgrnet.com;

    ssl_certificate /etc/nginx/ssl/kmgrnet.crt;
    ssl_certificate_key /etc/nginx/ssl/kmgrnet.key;

    root /var/www/html/likeshop/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

server {
    listen 80;
    server_name kmgrnet.com *.kmgrnet.com;
    return 301 https://$host$request_uri;
}
